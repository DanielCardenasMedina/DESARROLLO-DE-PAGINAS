<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso Académico - UCAL</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function confirmarSalida() {
            Swal.fire({
                title: '¿Estás seguro de que quieres salir?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'No, volver'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = "registro.html"; // Cambia 'registro.html' a la URL de tu página de registro
                }
            });
        }

        function toggleSupportBox() {
            var supportBox = document.getElementById('support-box');
            if (supportBox.style.display === 'block') {
                supportBox.style.display = 'none';
            } else {
                supportBox.style.display = 'block';
                supportBox.style.position = 'fixed';
                supportBox.style.bottom = '20px';
                supportBox.style.left = '120px'; // Ajusta la posición según sea necesario
                supportBox.style.width = '300px';
            }
        }

        function closeSupportBox() {
            document.getElementById('support-box').style.display = 'none';
        }

        function sendMessage() {
            var input = document.getElementById('support-input');
            var message = input.value;
            if (message.trim() !== "") {
                var newMessage = document.createElement('div');
                newMessage.className = 'bubble-right';
                newMessage.innerHTML = '<p>' + message + '</p>';
                document.querySelector('.support-content').appendChild(newMessage);
                input.value = ""; // Clear the input field
                // Scroll to the bottom of the support content
                var supportContent = document.querySelector('.support-content');
                supportContent.scrollTop = supportContent.scrollHeight;
            }
        }

        function handleInputKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function redirectToCursos() {
            window.location.href = "cursos.html";
        }
    </script>
</head>
<body>
    <main class="campus-main">
        <div class="campus-content">
            <header class="campus-header">
                <div class="header-left">
                    <img src="ima/logo.png" alt="Logo UCAL" class="header-logo">
                </div>
                <div class="header-center">
                    <h1>Universidad de Ciencias y Artes de América Latina</h1>
                </div>
                <div class="header-right">
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" placeholder="Buscar..." class="search-bar">
                        <i class="fas fa-microphone search-mic"></i>
                    </div>
                </div>
            </header>
            <div class="main-content">
                <aside class="sidebar-left">
                    <ul class="sidebar-menu">
                        <li onclick="window.location.href='campus.html'"><i class="fas fa-home"></i></li>
                        <li onclick="window.location.href='asistencia.html'"><i class="fas fa-calendar-alt"></i></li>
                        <li onclick="window.location.href='progreso-academico.html'"><i class="fas fa-chart-line"></i></li>
                        <li onclick="window.location.href='tutor.html'"><i class="fas fa-user-tie"></i></li>
                        <li onclick="toggleSupportBox()"><i class="fas fa-comments"></i></li>
                        <li onclick="confirmarSalida()"><i class="fas fa-sign-out-alt"></i></li>
                    </ul>
                </aside>
                <section class="center-content horizontal-content">
                    <h2>¡Bienvenido/a de nuevo, Angel Herrera! 👋</h2>
                    <div class="progress-title">
                        <h3>Progreso Académico</h3>
                    </div>
                    <div class="bulbs-container">
                        <div class="progress-content">
                            <div class="cable"></div>
                            <div class="bulbs">
                                <div class="bulb" id="cl1" onclick="redirectToCursos()"><i class="fas fa-lightbulb"></i><span>CL1</span></div>
                                <div class="bulb" id="cl2" onclick="redirectToCursos()"><i class="fas fa-lightbulb"></i><span>CL2</span></div>
                                <div class="bulb" id="cl3" onclick="redirectToCursos()"><i class="fas fa-lightbulb"></i><span>CL3</span></div>
                                <div class="bulb" id="cl4" onclick="redirectToCursos()"><i class="fas fa-lightbulb"></i><span>CL4</span></div>
                                <div class="bulb" id="cl5" onclick="redirectToCursos()"><i class="fas fa-lightbulb"></i><span>CL5</span></div>
                                <div class="bulb" id="cl6" onclick="redirectToCursos()"><i class="fas fa-lightbulb"></i><span>CL6</span></div>
                                <div class="bulb" id="cl7" onclick="redirectToCursos()"><i class="fas fa-lightbulb"></i><span>CL7</span></div>
                                <div class="bulb" id="cl8" onclick="redirectToCursos()"><i class="fas fa-lightbulb"></i><span>CL8</span></div>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- Recuadro de soporte -->
                <div id="support-box" class="support-box" style="display: none;">
                    <div class="support-header">
                        <h2>SOPORTE TÉCNICO</h2>
                    </div>
                    <div class="support-content">
                        <div class="bubble-left">
                            <p>Hola, Angel Herrera, soy tu asistente virtual, ¿Cuál es tu consulta?</p>
                        </div>
                    </div>
                    <div class="support-input">
                        <input id="support-input" type="text" placeholder="Escribe aquí tu duda...." onkeypress="handleInputKeyPress(event)">
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
